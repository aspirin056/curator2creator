name: Apply zigzag layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-zigzag.yml'

permissions:
  contents: write

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Increase zigzag overlap by 15 percent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '/* overlap-plus-15-v5 */'
          if marker in s:
              raise SystemExit(0)

          override = r'''
          /* overlap-plus-15-v5 */
          @media (min-width: 921px) {
            .card:nth-child(2) { top: -71px; }
            .card:nth-child(3) { top: -143px; }
            .card:nth-child(4) { top: -214px; }
          }

          @media (min-width: 921px) and (max-height: 820px) {
            .card:nth-child(2) { top: -64px; }
            .card:nth-child(3) { top: -129px; }
            .card:nth-child(4) { top: -193px; }
          }
          '''
          s = s.replace('</style>', override + '\n</style>')
          p.write_text(s)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Increase zigzag overlap by 15 percent'
          git push
