name: Apply zigzag layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-zigzag.yml'

permissions:
  contents: write

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply visual refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '/* zigzag-four-v3 */'
          if marker in s:
              raise SystemExit(0)

          override = r'''
          /* zigzag-four-v3 */
          @media (min-width: 921px) {
            .title-line.secondary {
              margin-top: 4px;
              font-size: clamp(2.65rem, 3.45vw, 3.85rem);
              letter-spacing: -0.04em;
              white-space: nowrap;
            }
            .preview,
            .agenda-preview {
              height: 240px;
            }
          }

          @media (min-width: 921px) and (max-height: 820px) {
            .preview,
            .agenda-preview {
              height: 210px;
            }
          }
          '''
          s = s.replace('</style>', override + '\n</style>')
          p.write_text(s)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Enlarge title subtitle and preview cards'
          git push
